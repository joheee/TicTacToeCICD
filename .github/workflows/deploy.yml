name: Deploy

# Ships main to EC2 after CI passes: build once, push to ECR (tag = git SHA), deploy over SSM,
# smoke test the public URL, and roll back to the last good tag if anything fails.
# AWS access comes from the deploy role in TicTacToeInfra (OIDC, no stored keys); every AWS value
# is a repository variable copied from that repo's Terraform outputs. Actions are pinned to commit SHAs
# (the tag is in the comment), like in ci.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      break_health:
        description: "Demo: ship a broken image (/api/health returns 503) to watch the automatic rollback"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  APP_URL: ${{ vars.APP_URL }}
  SSM_PARAM_PREFIX: ${{ vars.SSM_PARAM_PREFIX }}

jobs:
  deploy:
    name: Build, deploy, smoke test
    # Only CI runs from pushes to main (not PRs), or a manual run from main (the deploy role trusts main only).
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit CI checked, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check repository variables
        run: |
          missing=""
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY_URL EC2_INSTANCE_ID APP_URL SSM_PARAM_PREFIX; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing. Copy them from TicTacToeInfra's terraform output (see README)."
            exit 1
          fi

      - name: Image tag
        id: meta
        run: |
          sha=$(git rev-parse HEAD)
          if [ "${{ inputs.break_health }}" = "true" ]; then
            echo "tag=$sha-broken" >> "$GITHUB_OUTPUT"
            echo "force_unhealthy=1" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$sha" >> "$GITHUB_OUTPUT"
            echo "force_unhealthy=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # ECR tags are immutable, so a re-run for the same commit reuses the image it already pushed.
      - name: Check for an existing image
        id: existing
        run: |
          repo=${ECR_REPOSITORY_URL#*/}
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="${{ steps.meta.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${{ steps.meta.outputs.tag }} is already in ECR, skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.existing.outputs.exists == 'false'

      # Same Dockerfile and APP_VERSION build arg as ci.yml, so the image CI checked is the image that ships.
      - name: Build and push
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            FORCE_UNHEALTHY=${{ steps.meta.outputs.force_unhealthy }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSM
        id: deploy
        run: |
          deploy/ssm-run.sh deploy \
            "IMAGE_TAG=${{ steps.meta.outputs.tag }}" \
            "IMAGE_REPO=$ECR_REPOSITORY_URL" \
            "AWS_REGION=$AWS_REGION" \
            "SSM_PARAM_PREFIX=$SSM_PARAM_PREFIX"

      - name: Smoke test
        run: deploy/smoke-test.sh "$APP_URL" "${{ steps.meta.outputs.tag }}"

      - name: Mark as last good
        run: deploy/ssm-run.sh mark-good "IMAGE_TAG=${{ steps.meta.outputs.tag }}"

      # Runs only if the deploy started and something after it failed. The job still ends red.
      - name: Roll back to last good
        if: failure() && steps.deploy.outcome != 'skipped'
        run: |
          echo "::error::Deploy of ${{ steps.meta.outputs.tag }} failed, rolling back."
          deploy/ssm-run.sh rollback \
            "IMAGE_REPO=$ECR_REPOSITORY_URL" \
            "AWS_REGION=$AWS_REGION" \
            "SSM_PARAM_PREFIX=$SSM_PARAM_PREFIX"
          deploy/smoke-test.sh "$APP_URL"
          echo "::notice::Rolled back; the previous version is serving again."
