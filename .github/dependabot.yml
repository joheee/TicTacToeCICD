# Weekly update PRs. The pinned action SHAs, npm packages, base images and Compose images all go
# stale otherwise. Every PR runs CI (lint, tests, audit, image scan) before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one PR; majors (next, vitest, ...) stay separate for review.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
