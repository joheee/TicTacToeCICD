# Same file locally and on EC2. 
# Only .env values and IMAGE_TAG change.
name: tictactoe-app

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only: lets `npm run dev` on the host reach the DB, never reachable from outside.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs migrations to completion before the app container starts.
  migrate:
    image: ${IMAGE_REPO:-tictactoe-app}:${IMAGE_TAG:-dev}
    build:
      context: .
      args:
        APP_VERSION: ${IMAGE_TAG:-dev}
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${IMAGE_REPO:-tictactoe-app}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    # Loopback only: the proxy (EC2) or your browser (local) is the way in, never the public internet.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # HTTPS in front of the app. Off locally; on EC2 the deploy sets COMPOSE_PROFILES=proxy in .env.
  proxy:
    profiles: [proxy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume or Let's Encrypt rate limits kick in
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
